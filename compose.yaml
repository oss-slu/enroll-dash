services:
    db:
        build:
            context: .
            dockerfile: db.Dockerfile
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in .env}
            POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
            PGUSER: ${PGUSER:?Set PGUSER in .env}
            PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
            DUMP_DIR: /dump
        ports:
            - '${PGPORT:-5432}:5432'
        volumes:
            - db-data:/var/lib/postgresql/data
            - ./scripts/db/dump:/dump
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready --username "$${POSTGRES_USER}" --dbname "$${PGDATABASE}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    db-lite:
        build:
            context: .
            dockerfile: db-lite.Dockerfile
        restart: unless-stopped
        profiles:
            - lite
        environment:
            POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in .env}
            POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
            PGUSER: ${PGUSER:?Set PGUSER in .env}
            PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
            DUMP_DIR: /dump
        ports:
            - '${PG_LITE_PORT:-5532}:5432'
        volumes:
            - db-lite-data:/var/lib/postgresql/data
            - ./scripts/db/dump:/dump
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready --username "$${POSTGRES_USER}" --dbname "$${PGDATABASE}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    api:
        build:
            context: .
            dockerfile: api.Dockerfile
        restart: unless-stopped
        environment:
            PGHOST: ${PG_APP_HOST:-db}
            PGPORT: ${PG_APP_PORT:-5432}
            PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
            PGUSER: ${PGUSER:?Set PGUSER in .env}
            PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
        depends_on:
            db:
                condition: service_healthy
        ports:
            - 9876:9876

    app:
        build:
            context: .
            dockerfile: app.Dockerfile
        restart: unless-stopped
        ports:
            - 8089:80
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./app/index.html:/app/index.html:ro

volumes:
    db-data:
    db-lite-data:
